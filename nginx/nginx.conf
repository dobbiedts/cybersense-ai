# nginx/nginx.conf
# Template for OWASP modsecurity-crs image; mount this as:
# ./nginx/nginx.conf -> /etc/nginx/templates/nginx.conf.template

# Load ModSecurity module (image may provide it)
load_module modules/ngx_http_modsecurity_module.so;

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Basic security / logging
    server_tokens off;
    client_max_body_size 10M;

    # Enable ModSecurity and point to the ModSecurity configuration
    # The container must have /etc/modsecurity/modsecurity.conf available (built-in or mounted)
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity/modsecurity.conf;

    # Proxy timeouts & buffering tuned for APIs
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    send_timeout 60s;

    # Include dynamically generated conf.d files (entrypoint may populate these)
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        server_name _;

        # Gateway root (quick health)
        location = / {
            return 200 "OK\n";
        }

        # Health endpoints (forward to each service)
        location = /health_xss {
            proxy_pass http://xss-api:5000/health;
            proxy_set_header Host $host;
        }

        location = /health_sql {
            proxy_pass http://sql-api:5000/health;
            proxy_set_header Host $host;
        }

        # Route XSS API
        location ^~ /predict {
            proxy_pass http://xss-api:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # Route SQL API
        location ^~ /predict_sql {
            proxy_pass http://sql-api:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # Static / misc
        location /static {
            return 404;
        }

        # catch-all fallback for unknown paths (optional)
        location / {
            return 404;
        }
    }
}
