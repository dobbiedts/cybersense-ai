services:
  demo-app:
    build:
      context: .
      dockerfile: demo-app/Dockerfile
    container_name: demo-app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - security-net

  ai-gate:
    build:
      context: .
      dockerfile: ai-gate/Dockerfile
    container_name: ai-gate
    ports:
      - "8081:8000"
    environment:
      - APP_URL=http://demo-app:8000
      - SQLI_URL=http://sql-api:5000/predict_sql
      - XSS_URL=http://xss-api:5000/predict
      - GATE_FAIL_MODE=closed
      - RECORD_TOKEN=${RECORD_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/gate/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      demo-app:
        condition: service_healthy
      sql-api:
        condition: service_healthy
      xss-api:
        condition: service_healthy
    networks:
      - security-net

  nginx-modsecurity:
    image: owasp/modsecurity-crs:3.3.5-nginx-202308071108
    container_name: nginx-modsecurity
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BACKEND=http://ai-gate:8000
      - PROXY=1
      - MODSEC_RULE_ENGINE=On
      - PARANOIA=1
      # Write the JSON audit log to a file on the shared waf-logs volume
      # (default is /dev/stdout) so the waf-logger service can read it
      - MODSEC_AUDIT_LOG=/var/log/modsecurity/audit.log
    volumes:
      - waf-logs:/var/log/modsecurity
    depends_on:
      ai-gate:
        condition: service_healthy
    networks:
      - security-net

  xss-api:
    build:
      context: .
      dockerfile: project-a/xss-api/Dockerfile
    container_name: xss-api
    ports:
      - "5000:5000"
    environment:
      - RECORD_TOKEN=${RECORD_TOKEN}
    volumes:
      - event-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - security-net

  sql-api:
    build:
      context: .
      dockerfile: project-a/sql-api/Dockerfile
    container_name: sql-api
    ports:
      - "5001:5000"
    environment:
      - RECORD_TOKEN=${RECORD_TOKEN}
    volumes:
      - event-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - security-net

  compliance-engine:
    build:
      context: .
      dockerfile: compliance-engine/Dockerfile
    container_name: compliance-engine
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - security-net

  bridge:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    container_name: bridge
    ports:
      - "5003:5003"
    volumes:
      - event-data:/data
    depends_on:
      sql-api:
        condition: service_healthy
      xss-api:
        condition: service_healthy
      compliance-engine:
        condition: service_healthy
    networks:
      - security-net

  waf-logger:
    build:
      context: .
      dockerfile: waf-logger/Dockerfile
    container_name: waf-logger
    restart: unless-stopped
    environment:
      - AUDIT_LOG=/waf-logs/audit.log
      - DB_PATH=/data/events.db
    volumes:
      - waf-logs:/waf-logs:ro
      - event-data:/data
    depends_on:
      sql-api:
        condition: service_healthy
      xss-api:
        condition: service_healthy
    networks:
      - security-net

networks:
  security-net:
    driver: bridge

volumes:
  event-data:
  waf-logs: